[package]
name = "splora"
version = "3.4.0-dev"
authors = [
    "Roman Zeyde <me@romanzey.de>",
    "Nadav Ivgi <nadav@shesek.info>",
    "wiz <j@wiz.biz>",
    "junderw <jonathan.underwood4649@gmail.com>"
]
description = "An efficient re-implementation of Electrum Server in Rust"
license = "MIT"
homepage = "https://github.com/mempool/electrs"
repository = "https://github.com/mempool/electrs"
publish = false
keywords = ["bitcoin", "electrum", "server", "index", "database"]
readme = "README.md"
edition = "2018"
rust-version = "1.87"
autobins = false
default-run = "splora"

[lib]
name = "electrs"

[[bin]]
name = "splora"
path = "src/bin/electrs.rs"

[[bin]]
name = "popular-scripts"
path = "src/bin/popular-scripts.rs"

[[bin]]
name = "tx-fingerprint-stats"
path = "src/bin/tx-fingerprint-stats.rs"

[[bin]]
name = "splora-import"
path = "src/bin/splora-import.rs"

[[bin]]
name = "splora-queue"
path = "src/bin/splora-queue.rs"

[features]
default = []
liquid = ["elements"]
electrum-discovery = ["electrum-client"]

[dependencies]
arrayref = "0.3.6"
arc-swap = "1"
base64 = "0.13.0"
bincode-do-not-use-directly = { version = "1.3.1", package = "bincode" }
bitcoin = { version = "0.32.8", features = [ "serde" ] }
bounded-vec-deque = "0.1.1"
clap = "2.33.3"
crossbeam-channel = "0.5.0"
dirs = "4.0.0"
elements = { version = "0.26.1", features = [ "serde" ], optional = true }
error-chain = "0.12.4"
glob = "0.3"
hex = "0.4.2"
idna = "=1.0.3"
itertools = "0.10"
lazy_static = "1.3.0"
libc = "0.2"
log = "0.4.11"
socket2 = { version = "0.4", features = ["all"] }
nostr = { version = "0.43", default-features = true, features = ["nip98"] }
notify = "6.1"
num_cpus = "1.12.0"
page_size = "0.4.2"
prometheus = "0.13"
ppp = "2.3.0"
rayon = "1.5.0"
rocksdb = "0.24.0"
serde = "1.0.118"
serde_derive = "1.0.118"
serde_json = "1.0.120"
sha2 = "0.10.7"
signal-hook = "0.3"
stderrlog = "0.5.0"
time = { version = "0.3", features = ["formatting"] }
tiny_http = "0.11"
url = "2.2.0"
# idna 1.x (via url 2.5) defaults to idna_adapter 1.2 + ICU4X 2.3, which needs
# rustc 1.88. 1.1.x is the unicode-rs backend and matches rust-toolchain 1.87.
idna_adapter = "=1.1.0"
hyper = "0.14"
hyperlocal = "0.8"
# close to same tokio version as dependent by hyper v0.14 and hyperlocal 0.8 -- things can go awry if they mismatch
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time", "net"] }
# 0.21 matches hyper 0.14 / http 0.2. Newer tungstenite lines pull http 1.
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# optional dependencies for electrum-discovery
electrum-client = { version = "0.24.1", optional = true }

[dev-dependencies]
tempfile = "3.0"

[profile.release]
lto = true
panic = 'abort'
codegen-units = 1
