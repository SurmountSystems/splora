[package]
name = "splora"
version = "3.4.0-dev"
authors = [
    "Roman Zeyde <me@romanzey.de>",
    "Nadav Ivgi <nadav@shesek.info>",
    "wiz <j@wiz.biz>",
    "junderw <jonathan.underwood4649@gmail.com>"
]
description = "An efficient re-implementation of Electrum Server in Rust"
license = "MIT"
homepage = "https://github.com/mempool/electrs"
repository = "https://github.com/mempool/electrs"
publish = false
keywords = ["bitcoin", "electrum", "server", "index", "database"]
readme = "README.md"
edition = "2024"
rust-version = "1.98"
autobins = false
default-run = "splora"

[lib]
name = "electrs"

[[bin]]
name = "splora"
path = "src/bin/electrs.rs"

[[bin]]
name = "popular-scripts"
path = "src/bin/popular-scripts.rs"

[[bin]]
name = "tx-fingerprint-stats"
path = "src/bin/tx-fingerprint-stats.rs"

[[bin]]
name = "splora-import"
path = "src/bin/splora-import.rs"

[[bin]]
name = "splora-queue"
path = "src/bin/splora-queue.rs"

[[bin]]
name = "splora-http"
path = "src/bin/splora-http.rs"

[features]
default = []
liquid = ["elements"]
electrum-discovery = ["electrum-client"]

[dependencies]
arrayref = "0.3.6"
arc-swap = "1"
base64 = "0.22"
# Maintained bincode-1.3-compatible codec (RUSTSEC-2025-0141).
# wincode is a direct dep: src/util/bincode_util.rs names `wincode::config`.
serde-wincode = "0.1.2"
wincode = "0.6.1"
bitcoin = { version = "0.32.8", features = [ "serde" ] }
clap = { version = "4.5", features = ["cargo"] }
crossbeam-channel = "0.5.0"
dirs = "4.0.0"
elements = { version = "0.26.1", features = [ "serde" ], optional = true }
error-chain = "0.12.4"
glob = "0.3"
hex = "0.4.2"
idna = "=1.0.3"
itertools = "0.13"
lazy_static = "1.3.0"
libc = "0.2"
log = "0.4.11"
socket2 = { version = "0.5", features = ["all"] }
# 0.45.1+ drops the wasm32 `instant` dep (RUSTSEC-2024-0384). Lock is 0.45.4
# (Menhera 7-day window has elapsed). os-rng is required for Keys::generate in tests.
nostr = { version = "0.45.1", default-features = false, features = ["std", "os-rng", "nip98"] }
# 8.x uses bitflags 2 and mio 1. 7.x pulled unmaintained `instant`
# (RUSTSEC-2024-0384) via notify-types 1.
notify = "8.0"
num_cpus = "1.12.0"
page_size = "0.4.2"
# Text exposition only. Default `protobuf` pulled protobuf 2.28.0 (RUSTSEC-2024-0437).
prometheus = { version = "0.14.0", default-features = false }
ppp = "2.3.0"
rayon = "1.5.0"
rocksdb = "0.24.0"
serde = "1.0.118"
serde_derive = "1.0.118"
serde_json = "1.0.120"
sha2 = "0.10.7"
signal-hook = "0.3"
stderrlog = "0.6.0"
time = { version = "0.3", features = ["formatting"] }
tiny_http = "0.11"
url = "2.2.0"
# idna 1.x (via url 2.5) defaults to idna_adapter 1.2 + ICU4X 2.3. 1.1.x is the
# unicode-rs backend. Keep this pin so a blanket cargo update does not float 1.2.
idna_adapter = "=1.1.0"
# hyper 1 pulls h2 >= 0.4.16 (RUSTSEC-2026-0258). Indexer REST and queue unix
# stay HTTP/1.1-only. splora-http still speaks HTTP/2 after TLS ALPN h2.
hyper = { version = "1", default-features = false, features = [
    "server",
    "client",
    "http1",
    "http2",
] }
hyper-util = { version = "0.1", default-features = false, features = [
    "tokio",
    "server",
    "server-graceful",
    "client",
    "client-legacy",
    "http1",
    "http2",
    "service",
] }
http-body-util = "0.1"
# 0.9 is hyper 1. 0.8 is hyper 0.14 only.
hyperlocal = "0.9"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time", "net", "io-util", "fs"] }
# Public TLS terminator (splora-http). TLS 1.3 only. Indexer unix stays HTTP/1.1.
bytes = "1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
# PEM load uses rustls::pki_types::pem::PemObject (RUSTSEC-2025-0134: rustls-pemfile unmaintained).
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-aws-lc-rs"] }
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", default-features = false }
# 0.21 already speaks http 1. Keep it; tungstenite rand 0.8 skip may remain.
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# optional dependencies for electrum-discovery
electrum-client = { version = "0.24.1", optional = true }

[dev-dependencies]
tempfile = "3.0"

[profile.release]
lto = true
panic = 'abort'
codegen-units = 1
