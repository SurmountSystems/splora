# Supply-chain policy for splora.
# Laptop: `just check-local` runs `cargo deny`. This is not a flake check.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
# Production packages are default features and `--features liquid`.
# Do not enable electrum-discovery here.
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDDL-1.0",
    "NCSA",
]
# AGPL and SSPL are omitted on purpose. They would infect the binary.
# GPL-2.0 / GPL-3.0 are omitted for the same reason.

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    # Workspace `.cargo/config.toml` rewrites crates.io to this 7-day cooldown
    # sparse index. Lockfile entries still name the crates.io index URL.
    "sparse+https://index.crates.menhera.org/7d/",
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
