# Supply-chain policy for splora.
# Laptop: `just check-local` runs `cargo deny`. This is not a flake check.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
# Production packages are default features and `--features liquid`.
# Do not enable electrum-discovery here.
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates that this wave does not replace (API is not small, or
# the bytes on disk are the Mempool schema). cargo-deny 0.19 treats these as
# errors unless ignored. Reasons stay in doc/supply-chain.md.
ignore = [
    { id = "RUSTSEC-2021-0139", reason = "ansi_term is clap 2 only; clap 4 is a CLI rewrite, not this wave" },
    { id = "RUSTSEC-2024-0375", reason = "atty is clap 2 and stderrlog 0.5; std IsTerminal needs those callers rewritten" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is the indexer on-disk schema; do not swap codecs in a lock-only wave" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    # rust-bitcoin hex_lit (via bitcoin 0.32.102). MIT plus no-false-attribs.
    "MITNFA",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDDL-1.0",
    "NCSA",
]
# AGPL and SSPL are omitted on purpose. They would infect the binary.
# GPL-2.0 / GPL-3.0 are omitted for the same reason.

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    # Workspace `.cargo/config.toml` rewrites crates.io to this 7-day cooldown
    # sparse index. Lockfile entries still name the crates.io index URL.
    "sparse+https://index.crates.menhera.org/7d/",
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
