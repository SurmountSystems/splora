# Supply-chain policy for splora.
# Laptop: `just check-local` runs `cargo deny --offline --locked check`. This is not a flake check.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
# Production packages are default features and `--features liquid`.
# Do not enable electrum-discovery here.
all-features = false
no-default-features = false

[advisories]
version = 2
# Yanked status is read from the local index cache (`cargo deny --offline
# --locked check` in just check-local). Live yanked rows are also
# cargo-audit's job, which runs next in that recipe. Do not fetch crates.io
# to skip Menhera.
yanked = "deny"
# Unmaintained rustsec rows that used to live here (clap 2 ansi_term/atty,
# bincode 1.3.3) left the Linux graph in the 2026-08-31 warning wave.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    # rust-bitcoin hex_lit (via bitcoin 0.32.102). MIT plus no-false-attribs.
    "MITNFA",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
]
# AGPL and SSPL are omitted on purpose. They would infect the binary.
# GPL-2.0 / GPL-3.0 are omitted for the same reason.

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
# Duplicate versions we cannot unify without leaving bitcoin 0.32, nostr 0.45,
# hyper 0.14, or the bindgen/cc stack. Skip the older copy so deny does not
# flood warnings. Reasons stay next to each skip.
skip = [
    { crate = "bech32@0.11", reason = "bitcoin 0.32 vs nostr 0.45" },
    { crate = "bitcoin_hashes@0.14", reason = "bitcoin 0.32 vs nostr 0.45" },
    { crate = "hex-conservative@0.2", reason = "bitcoin 0.32 vs nostr 0.45" },
    { crate = "secp256k1@0.29", reason = "bitcoin 0.32 vs nostr 0.45" },
    { crate = "rand@0.8", reason = "tungstenite 0.21 vs nostr 0.45 (rand 0.10)" },
    { crate = "getrandom@0.2", reason = "rand 0.8 via tungstenite; nostr uses getrandom 0.4" },
    { crate = "rand_core@0.6", reason = "rand 0.8 via tungstenite; nostr uses rand_core 0.10" },
    { crate = "http@0.2", reason = "hyper 0.14 vs tungstenite http 1" },
    { crate = "shlex@1", reason = "bindgen/cc still pull shlex 1 next to shlex 2" },
    { crate = "socket2@0.5", reason = "hyper 0.14 stays on socket2 0.5; tokio uses 0.6" },
    { crate = "syn@2", reason = "bindgen and thiserror 1 stay on syn 2; serde_derive uses syn 3" },
    { crate = "thiserror@1", reason = "tungstenite 0.21 and ppp stay on thiserror 1; wincode uses 2" },
    { crate = "thiserror-impl@1", reason = "companion of thiserror 1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    # Fetch still uses Menhera via workspace `.cargo/config.toml`.
    # Lockfile crates record registry+https://github.com/rust-lang/crates.io-index
    # after that rewrite.
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
