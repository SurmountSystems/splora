[workspace]
resolver = "3"

[package]
name = "splora-web"
version = "0.1.0"
edition = "2024"
publish = false
description = "Client-side rendered Splora explorer"
license = "Unlicense"

[lib]
name = "splora_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
splora-api = { path = "../splora-api" }
splora-frontend-shared = { path = "../shared" }
leptos = { version = "=0.8.20", default-features = false, features = ["csr"] }
leptos_meta = { version = "=0.8.6", default-features = false }
leptos_router = { version = "=0.8.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Headers", "Location", "Request", "RequestInit", "RequestMode", "Response", "Window"] }
