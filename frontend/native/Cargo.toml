[package]
name = "splora-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "GPUI desktop explorer for https://splora.surmount.systems"
license = "MIT"

[dependencies]
splora-api = { path = "../splora-api" }
splora-frontend-shared = { path = "../shared" }
nostr = { version = "=0.45.4", default-features = false, features = ["std", "os-rng", "nip98"] }
gpui = { package = "gpui-pre", version = "=0.3.5", default-features = false, features = ["x11"] }
anyhow = "1"
gpui-pre-platform = { version = "=0.3.5", features = ["wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
dirs = "=4.0.0"
url = "=2.5.4"
